name: BLC PostgreSQL CI

on:
  push:
    branches:
      - feat/blc-deferred-referral-rewards-clean
      - design/blc-refund-chargeback
  pull_request:
    branches:
      - main
    paths:
      - "supabase/proposals/**"
      - "supabase/migrations/**"
      - "supabase/migration-archive/**"
      - "docs/MIGRATION_HISTORY_RECOVERY.md"
      - ".github/workflows/blc-postgres-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blc-postgres:
    name: BLC integration tests (PostgreSQL 17)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: baddielink_blc_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d baddielink_blc_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: baddielink_blc_ci
      PGUSER: postgres
      PGPASSWORD: ci-only-password
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js for Wave security utility tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test Wave signature and checkout utilities
        run: node --test supabase/functions/_shared/wave.test.js

      - name: Set up Deno for Supabase Edge Function validation
        uses: denoland/setup-deno@v2

      - name: Type-check Wave checkout Edge Function
        run: deno check --no-lock supabase/functions/create-wave-checkout/index.ts

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Initialize isolated Supabase-compatible test objects
        run: psql -v ON_ERROR_STOP=1 -f supabase/proposals/tests/bootstrap.sql

      - name: Apply BLC ledger foundation proposal
        run: psql -v ON_ERROR_STOP=1 -f supabase/proposals/BLC_LEDGER_FOUNDATION.sql

      - name: Apply gift inventory and settlement proposal
        run: psql -v ON_ERROR_STOP=1 -f supabase/proposals/BLC_GIFTS_AND_SETTLEMENT.sql

      - name: Apply deferred referral schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/proposals/BLC_REFERRAL_REWARDS.sql

      - name: Apply funding provenance and deferred reward triggers
        run: psql -v ON_ERROR_STOP=1 -f supabase/proposals/BLC_REFERRAL_PROVENANCE.sql

      - name: Apply authenticated gift RPC wrappers
        run: psql -v ON_ERROR_STOP=1 -f supabase/proposals/BLC_GIFT_RPC_WRAPPERS.sql

      - name: Apply referral-code lifecycle proposal
        run: psql -v ON_ERROR_STOP=1 -f supabase/proposals/BLC_REFERRAL_LIFECYCLE.sql

      - name: Check member interface JavaScript syntax
        run: |
          node --check auth-integration.js
          node --check script.js

      - name: Run BLC integration tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/proposals/tests/blc_integration.sql

      - name: Apply Wave top-up schema proposal
        run: psql -v ON_ERROR_STOP=1 -f supabase/proposals/BLC_WAVE_TOPUP_SCHEMA.sql

      - name: Run Wave top-up schema constraint tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/proposals/tests/blc_wave_topup_schema.sql

      - name: Apply authenticated Wave checkout RPC proposal
        run: psql -v ON_ERROR_STOP=1 -f supabase/proposals/BLC_WAVE_CHECKOUT_RPCS.sql

      - name: Run Wave checkout RPC tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/proposals/tests/blc_wave_checkout_rpcs.sql

      - name: Apply Wave purchased-funding provenance proposal
        run: psql -v ON_ERROR_STOP=1 -f supabase/proposals/BLC_WAVE_GIFT_PROVENANCE.sql

      - name: Run Wave gift inventory provenance tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/proposals/tests/blc_wave_gift_provenance.sql

      - name: Run BLC concurrent spending and inventory tests
        run: bash supabase/proposals/tests/blc_concurrency.sh
