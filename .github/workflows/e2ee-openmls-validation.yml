name: E2EE OpenMLS validation

on:
  pull_request:
    branches: [main]
    paths:
      - "experiments/openmls-browser-poc/**"
      - ".github/workflows/e2ee-openmls-validation.yml"
      - "docs/E2EE_IMPLEMENTATION_PLAN.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2ee-openmls-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-browser-test:
    name: Build OpenMLS WASM and test in Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: experiments/openmls-browser-poc

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: experiments/openmls-browser-poc

      - name: Install wasm-pack
        uses: taiki-e/install-action@wasm-pack

      - name: Resolve and record dependency lockfile
        run: cargo generate-lockfile

      - name: Compile default production WASM without test admission APIs
        run: |
          wasm-pack build --target web --out-dir pkg-production --out-name openmls_wasm --locked
          if grep -q "merge_staged_commit_for_browser_test" pkg-production/openmls_wasm.js; then
            echo "Test-only staged Commit merge API leaked into the default WASM build."
            exit 1
          fi

      - name: Compile isolated browser-test WASM
        run: |
          wasm-pack build --target web --out-dir pkg --out-name openmls_wasm --locked -- --features browser-test-admission
          cp static/index.html pkg/index.html
          cp static/mls-lock.js pkg/mls-lock.js
          cp static/opfs-storage-worker.js pkg/opfs-storage-worker.js
          cp static/opfs-journal-worker.js pkg/opfs-journal-worker.js
          cp static/opfs-wasm-bridge-worker.js pkg/opfs-wasm-bridge-worker.js
          cp static/mls-runtime-worker.js pkg/mls-runtime-worker.js

      - name: Run native Rust tests
        run: cargo test --locked

      - name: Verify explicit test-only issuer trust configuration
        run: cargo test --locked --features attestation-test-issuer

      - name: Install Node.js and Playwright
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chromium browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Serve the compiled browser harness
        run: |
          python3 -m http.server 4173 --directory pkg > /tmp/openmls-http.log 2>&1 &
          echo $! > /tmp/openmls-http.pid

      - name: Verify the MLS browser round-trip
        run: node browser-smoke-test.mjs

      - name: Verify MLS browser concurrency lock
        run: node concurrency-smoke-test.mjs

      - name: Verify OPFS worker storage primitives
        run: node opfs-storage-smoke-test.mjs

      - name: Verify OPFS journal recovery
        run: node opfs-journal-smoke-test.mjs

      - name: Verify OPFS journal survives worker restart
        run: node opfs-journal-restart-smoke-test.mjs

      - name: Verify synchronous OPFS bridge from WASM
        run: node opfs-wasm-bridge-smoke-test.mjs

      - name: Verify worker-owned MLS commit and restart recovery
        run: node mls-runtime-smoke-test.mjs

      - name: Upload build output and resolved lockfile for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openmls-wasm-validation-${{ github.sha }}
          path: |
            experiments/openmls-browser-poc/Cargo.lock
            experiments/openmls-browser-poc/pkg/
          if-no-files-found: warn
          retention-days: 14
